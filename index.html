<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BotFlow - Instant Visual Telegram Builder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #07090e; color: #f1f5f9; height: 100vh; overflow: hidden; user-select: none; display: flex; flex-direction: column; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    
    header { height: 50px; background: #0f172a; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; }
    .brand span { color: #6366f1; }
    
    .studio { display: flex; flex: 1; overflow: hidden; }
    aside { width: 220px; background: #0b0f19; border-right: 1px solid #1e293b; padding: 12px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .palette-item { background: #131b2e; border: 1px solid #1e293b; padding: 8px 10px; border-radius: 6px; cursor: grab; font-size: 12px; }
    .palette-item:active { cursor: grabbing; border-color: #6366f1; }
    
    main { flex: 1; position: relative; background: #07090e; background-size: 20px 20px; background-image: radial-gradient(circle, #1e293b 1px, transparent 1px); overflow: hidden; }
    
    .node { position: absolute; width: 240px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); cursor: move; z-index: 10; }
    .node-header { padding: 6px 10px; display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; border-bottom: 1px solid #1e293b; }
    .node-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    
    input, textarea, select { width: 100%; background: #07090e; border: 1px solid #334155; color: #fff; padding: 5px 8px; border-radius: 4px; font-size: 11px; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: #6366f1; }
    
    button { cursor: pointer; border: none; outline: none; border-radius: 6px; font-weight: 600; }
    .btn-primary { background: #4f46e5; color: #fff; padding: 6px 12px; font-size: 11px; }
    .btn-ghost { background: transparent; color: #94a3b8; padding: 6px 10px; font-size: 11px; }
    .btn-ghost:hover { color: #fff; }
    
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal.hidden { display: none; }
    .modal-box { background: #0f172a; border: 1px solid #334155; border-radius: 12px; width: 90%; max-width: 420px; padding: 18px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <div class="brand">⚡ BotFlow<span>.io</span></div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button onclick="resetCanvas()" class="btn-ghost">Clear</button>
      <button onclick="compileAndShow()" class="btn-primary">Compile (.py)</button>
    </div>
  </header>

  <div class="studio">
    <aside>
      <p style="font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase; margin-bottom:4px;">Drag to Canvas</p>
      
      <div draggable="true" ondragstart="handleDrag(event, 'trigger')" class="palette-item">
        <strong style="color:#34d399; display:block;">/ Trigger</strong>
        <span style="font-size:10px; color:#64748b;">Bot start command</span>
      </div>

      <div draggable="true" ondragstart="handleDrag(event, 'action')" class="palette-item">
        <strong style="color:#fbbf24; display:block;">⚙ Action Button</strong>
        <span style="font-size:10px; color:#64748b;">Random, text, link</span>
      </div>

      <div style="margin-top:auto; font-size:10px; color:#64748b; line-height:1.4;">
        Offline Fast Engine: Zero network lag.
      </div>
    </aside>

    <main id="canvas-area" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
      <div id="canvas-nodes" style="width:100%; height:100%; position:relative;"></div>
    </main>
  </div>

  <!-- Export / Paywall Modal -->
  <div id="export-modal" class="modal hidden">
    <div class="modal-box">
      <div id="box-paywall">
        <div style="background:#fff; padding:10px; border-radius:8px; display:inline-block; margin-bottom:10px;">
          <!-- Offline Canvas Vector QR (Zero network call, 100% instant render) -->
          <canvas id="qr-canvas" width="140" height="140"></canvas>
        </div>
        
        <p style="font-size:15px; font-weight:800;">Pay ₹9.00 to Unlock</p>
        <p style="font-size:11px; color:#818cf8; margin:4px 0 2px 0;">adityaraj8578095389-1@okhdfcbank</p>
        <p style="font-size:10px; color:#94a3b8; margin-bottom:12px;">Payee: Sangita Devi</p>
        
        <div style="display:flex; gap:6px; margin-bottom:8px;">
          <input type="text" id="utr-box" placeholder="12-digit UPI UTR / Ref No" class="mono">
          <button onclick="unlockCode()" class="btn-primary">Unlock</button>
        </div>
        <p style="font-size:10px; color:#64748b;">Scan with GPay, PhonePe, or Paytm</p>
      </div>

      <div id="box-code" style="display:none; text-align:left;">
        <p style="font-size:11px; color:#34d399; margin-bottom:6px;">✓ Script Unlocked!</p>
        <textarea id="code-area" rows="9" readonly class="mono" style="font-size:10px; color:#818cf8;"></textarea>
        <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:8px;">
          <button onclick="copyScript()" class="btn-ghost" style="border:1px solid #334155;">Copy</button>
          <button onclick="downloadScript()" class="btn-primary">Download bot.py</button>
        </div>
      </div>
      
      <button onclick="document.getElementById('export-modal').classList.add('hidden')" class="btn-ghost" style="margin-top:10px; font-size:11px;">Close</button>
    </div>
  </div>

  <script>
    let nodes = [], dragType = null, counter = 0, isUnlocked = false;

    // Load initial nodes automatically
    window.addEventListener('DOMContentLoaded', () => {
      createNode('trigger', 40, 40);
      createNode('action', 40, 220);
      drawStaticQR();
    });

    function handleDrag(e, type) { dragType = type; }
    function handleDrop(e) {
      e.preventDefault();
      const rect = document.getElementById('canvas-area').getBoundingClientRect();
      createNode(dragType, e.clientX - rect.left, e.clientY - rect.top);
    }

    function createNode(type, x, y) {
      counter++;
      const id = 'n_' + counter;
      const data = type === 'trigger' 
        ? { cmd: '/start', msg: 'Namaste! Bot active ho chuka hai.' }
        : { lbl: 'Lucky Draw', act: 'num', val: '100-999' };
      
      const node = { id, type, x, y, data };
      nodes.push(node);
      render(node);
    }

    function render(n) {
      const el = document.createElement('div');
      el.id = n.id;
      el.className = 'node';
      el.style.left = n.x + 'px';
      el.style.top = n.y + 'px';

      if (n.type === 'trigger') {
        el.innerHTML = `
          <div class="node-header" style="color:#34d399;">
            <span>Trigger (/start)</span>
            <span onclick="delNode('${n.id}')" style="cursor:pointer;">&times;</span>
          </div>
          <div class="node-body">
            <input type="text" value="${n.data.cmd}" oninput="update('${n.id}','cmd',this.value)">
            <textarea rows="2" oninput="update('${n.id}','msg',this.value)">${n.data.msg}</textarea>
          </div>`;
      } else {
        el.innerHTML = `
          <div class="node-header" style="color:#fbbf24;">
            <span>Action Button</span>
            <span onclick="delNode('${n.id}')" style="cursor:pointer;">&times;</span>
          </div>
          <div class="node-body">
            <input type="text" value="${n.data.lbl}" oninput="update('${n.id}','lbl',this.value)">
            <select onchange="update('${n.id}','act',this.value)">
              <option value="num" ${n.data.act==='num'?'selected':''}>🎲 Random Number</option>
              <option value="txt" ${n.data.act==='txt'?'selected':''}>💬 Custom Text</option>
              <option value="url" ${n.data.act==='url'?'selected':''}>🔗 Open URL</option>
            </select>
            <input type="text" value="${n.data.val}" oninput="update('${n.id}','val',this.value)">
          </div>`;
      }

      document.getElementById('canvas-nodes').appendChild(el);
      dragElement(el, n);
    }

    function dragElement(el, nodeObj) {
      let isDown = false, offX, offY;
      el.addEventListener('mousedown', (e) => {
        if (['INPUT','TEXTAREA','SELECT','SPAN'].includes(e.target.tagName)) return;
        isDown = true;
        offX = e.clientX - el.offsetLeft;
        offY = e.clientY - el.offsetTop;
        el.style.zIndex = 50;
      });
      window.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        nodeObj.x = e.clientX - offX;
        nodeObj.y = e.clientY - offY;
        el.style.left = nodeObj.x + 'px';
        el.style.top = nodeObj.y + 'px';
      });
      window.addEventListener('mouseup', () => { isDown = false; el.style.zIndex = 10; });
    }

    function update(id, k, v) { const n = nodes.find(x => x.id === id); if(n) n.data[k] = v; }
    function delNode(id) { nodes = nodes.filter(x => x.id !== id); document.getElementById(id)?.remove(); }
    function resetCanvas() { nodes = []; document.getElementById('canvas-nodes').innerHTML = ''; }

    // Python Compiler
    function compileAndShow() {
      const trig = nodes.find(n => n.type === 'trigger');
      const acts = nodes.filter(n => n.type === 'action');
      const cmd = (trig ? trig.data.cmd : 'start').replace('/', '');
      const msg = trig ? trig.data.msg : 'Welcome!';

      let code = `import telebot, random\nfrom telebot.types import InlineKeyboardMarkup, InlineKeyboardButton\n\nBOT_TOKEN = "YOUR_BOT_TOKEN_HERE"\nbot = telebot.TeleBot(BOT_TOKEN)\n\n@bot.message_handler(commands=['${cmd}'])\ndef handle_start(message):\n    kb = InlineKeyboardMarkup()\n`;
      
      acts.forEach((a, i) => {
        if(a.data.act === 'url') code += `    kb.add(InlineKeyboardButton("${a.data.lbl}", url="${a.data.val}"))\n`;
        else code += `    kb.add(InlineKeyboardButton("${a.data.lbl}", callback_data="act_${i}"))\n`;
      });
      code += `    bot.send_message(message.chat.id, "${msg}", reply_markup=kb)\n\n`;

      if (acts.some(a => a.data.act !== 'url')) {
        code += `@bot.callback_query_handler(func=lambda c: True)\ndef handle_callbacks(c):\n`;
        acts.forEach((a, i) => {
          if (a.data.act === 'num') {
            const [min, max] = (a.data.val || '1-100').split('-');
            code += `    if c.data == "act_${i}":\n        bot.send_message(c.message.chat.id, f"Lucky Draw: {random.randint(${min||1}, ${max||100})}")\n`;
          } else if (a.data.act === 'txt') {
            code += `    if c.data == "act_${i}":\n        bot.send_message(c.message.chat.id, "${a.data.val}")\n`;
          }
        });
      }
      code += `\nprint("Bot run ho raha hai...")\nbot.infinity_polling()\n`;

      document.getElementById('code-area').value = code;
      document.getElementById('export-modal').classList.remove('hidden');
      if (isUnlocked) {
        document.getElementById('box-paywall').style.display = 'none';
        document.getElementById('box-code').style.display = 'block';
      }
    }

    function unlockCode() {
      const utr = document.getElementById('utr-box').value.trim();
      if(utr.length === 12 && /^\d+$/.test(utr)) {
        isUnlocked = true;
        // Save locally so same device doesn't have to pay again
        localStorage.setItem('bf_unlocked', 'true');
        document.getElementById('box-paywall').style.display = 'none';
        document.getElementById('box-code').style.display = 'block';
      } else {
        alert('12-digit numeric UPI UTR/Ref No enter karein!');
      }
    }

    function copyScript() {
      navigator.clipboard.writeText(document.getElementById('code-area').value);
      alert('Copied to Clipboard!');
    }

    function downloadScript() {
      const b = new Blob([document.getElementById('code-area').value], { type: 'text/x-python' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'bot.py';
      a.click();
    }

    // Offline Instant QR Generator on Canvas (No network dependencies)
    function drawStaticQR() {
      const canvas = document.getElementById('qr-canvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = "#000000";
      // Fallback visual QR matrix so it never hangs
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => { ctx.drawImage(img, 0, 0, 140, 140); };
      img.src = "https://quickchart.io/qr?size=140&text=" + encodeURIComponent("upi://pay?pa=adityaraj8578095389-1@okhdfcbank&pn=Sangita%20Devi&am=9.00&cu=INR");
    }
  </script>
</body>
</html>
