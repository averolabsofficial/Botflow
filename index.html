<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BotFlow AI - Instant Edition</title>
  
  <!-- Zero-overhead, pure compressed native CSS (No Tailwind CDN lag) -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #07090e; color: #f1f5f9; height: 100vh; overflow: hidden; user-select: none; display: flex; flex-direction: column; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    
    /* Header */
    header { height: 54px; background: #0d121f; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; }
    .brand span { color: #818cf8; }
    
    /* Layout */
    .studio { display: flex; flex: 1; overflow: hidden; }
    aside { width: 250px; background: #0b0f19; border-right: 1px solid #1e293b; padding: 14px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
    .palette-item { background: #131b2e; border: 1px solid #1e293b; padding: 10px; border-radius: 8px; cursor: grab; font-size: 12px; }
    .palette-item:active { cursor: grabbing; border-color: #6366f1; }
    
    /* Canvas */
    main { flex: 1; position: relative; background-size: 24px 24px; background-image: radial-gradient(circle, #1e293b 1px, transparent 1px); overflow: hidden; }
    
    /* Nodes */
    .node { position: absolute; width: 260px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); cursor: move; }
    .node-header { padding: 8px 12px; display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; border-bottom: 1px solid #1e293b; }
    .node-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    
    /* Inputs & Buttons */
    input, textarea, select { width: 100%; background: #07090e; border: 1px solid #334155; color: #fff; padding: 6px 8px; border-radius: 6px; font-size: 11px; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: #6366f1; }
    button { cursor: pointer; border: none; outline: none; border-radius: 6px; font-weight: 600; }
    .btn-primary { background: #4f46e5; color: #fff; padding: 6px 14px; font-size: 12px; }
    .btn-primary:hover { background: #4338ca; }
    .btn-ghost { background: transparent; color: #94a3b8; padding: 6px 10px; font-size: 11px; }
    .btn-ghost:hover { color: #fff; }
    
    /* Modal */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal.hidden { display: none; }
    .modal-box { background: #0f172a; border: 1px solid #334155; border-radius: 12px; width: 90%; max-width: 440px; padding: 20px; text-align: center; }
  </style>

  <!-- Async loading Firebase so it doesn't block the screen render -->
  <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <header>
    <div class="brand">⚡ BotFlow<span>.io</span></div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button onclick="document.getElementById('auth-modal').classList.remove('hidden')" id="btn-auth" class="btn-ghost" style="border:1px solid #334155;">Sign In</button>
      <span id="user-display" class="mono" style="font-size:11px; color:#818cf8; display:none;"></span>
      <button onclick="resetCanvas()" class="btn-ghost">Clear</button>
      <button onclick="compileAndShow()" class="btn-primary">Compile (.py)</button>
    </div>
  </header>

  <div class="studio">
    <aside>
      <p style="font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase;">Components</p>
      
      <div draggable="true" ondragstart="handleDrag(event, 'trigger')" class="palette-item">
        <strong style="color:#34d399;">/ Trigger</strong>
        <p style="font-size:10px; color:#64748b;">Bot start command</p>
      </div>

      <div draggable="true" ondragstart="handleDrag(event, 'action')" class="palette-item">
        <strong style="color:#fbbf24;">⚙ Action Button</strong>
        <p style="font-size:10px; color:#64748b;">Random, text, ya link</p>
      </div>
      
      <div style="margin-top:auto; font-size:10px; color:#64748b; line-height:1.4;">
        Instant Engine: Zero-load freeze mode.
      </div>
    </aside>

    <main id="canvas-area" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
      <div id="canvas-nodes" style="width:100%; height:100%; position:relative;"></div>
    </main>
  </div>

  <!-- Quick Auth Modal -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-box">
      <h3 style="font-size:14px; margin-bottom:12px;">Sign In / Sign Up</h3>
      <input type="email" id="acc-email" placeholder="Email" style="margin-bottom:8px;">
      <input type="password" id="acc-pass" placeholder="Password" style="margin-bottom:12px;">
      <button onclick="runAuth()" class="btn-primary" style="width:100%;">Continue</button>
      <button onclick="document.getElementById('auth-modal').classList.add('hidden')" class="btn-ghost" style="margin-top:8px;">Cancel</button>
    </div>
  </div>

  <!-- Unlock / Export Modal -->
  <div id="export-modal" class="modal hidden">
    <div class="modal-box">
      <div id="box-paywall">
        <div style="background:#fff; padding:8px; border-radius:8px; display:inline-block; margin-bottom:10px;">
          <!-- Instant local/fast QR -->
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=adityaraj8578095389-1@okhdfcbank%26pn=Sangita%20Devi%26am=9.00%26cu=INR%26tn=BotFlow%20Script" width="140" height="140" alt="UPI QR">
        </div>
        <p style="font-size:16px; font-weight:800; margin-bottom:2px;">₹9.00 Auto-Locked</p>
        <p style="font-size:10px; color:#94a3b8; margin-bottom:12px;">Payee: Sangita Devi</p>
        
        <div style="display:flex; gap:6px;">
          <input type="text" id="utr-box" placeholder="12-digit UPI Ref/UTR" class="mono">
          <button onclick="unlockCode()" class="btn-primary">Unlock</button>
        </div>
      </div>

      <div id="box-code" style="display:none; text-align:left;">
        <p style="font-size:11px; color:#34d399; margin-bottom:6px;">✓ Script Unlocked!</p>
        <textarea id="code-area" rows="8" readonly class="mono" style="font-size:10px; color:#818cf8;"></textarea>
        <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:8px;">
          <button onclick="copyScript()" class="btn-ghost" style="border:1px solid #334155;">Copy</button>
          <button onclick="downloadScript()" class="btn-primary">Download bot.py</button>
        </div>
      </div>
      
      <button onclick="document.getElementById('export-modal').classList.add('hidden')" class="btn-ghost" style="margin-top:12px; font-size:11px;">Close</button>
    </div>
  </div>

  <script>
    let nodes = [], dragType = null, counter = 0, isUnlocked = false;

    // Fast Node Operations (Runs immediately without waiting for Firebase)
    function handleDrag(e, type) { dragType = type; }
    function handleDrop(e) {
      e.preventDefault();
      const rect = document.getElementById('canvas-area').getBoundingClientRect();
      createNode(dragType, e.clientX - rect.left, e.clientY - rect.top);
    }

    function createNode(type, x, y) {
      counter++;
      const id = 'n_' + counter;
      const data = type === 'trigger' 
        ? { cmd: '/start', msg: 'Welcome to this Bot!' }
        : { lbl: 'Lucky Draw', act: 'num', val: '100-999' };
      
      const node = { id, type, x, y, data };
      nodes.push(node);
      render(node);
    }

    function render(n) {
      const el = document.createElement('div');
      el.id = n.id;
      el.className = 'node';
      el.style.left = n.x + 'px';
      el.style.top = n.y + 'px';

      if (n.type === 'trigger') {
        el.innerHTML = `
          <div class="node-header" style="color:#34d399;">
            <span>Trigger (/start)</span>
            <span onclick="delNode('${n.id}')" style="cursor:pointer;">&times;</span>
          </div>
          <div class="node-body">
            <input type="text" value="${n.data.cmd}" oninput="update('${n.id}','cmd',this.value)">
            <textarea rows="2" oninput="update('${n.id}','msg',this.value)">${n.data.msg}</textarea>
          </div>`;
      } else {
        el.innerHTML = `
          <div class="node-header" style="color:#fbbf24;">
            <span>Action Button</span>
            <span onclick="delNode('${n.id}')" style="cursor:pointer;">&times;</span>
          </div>
          <div class="node-body">
            <input type="text" value="${n.data.lbl}" oninput="update('${n.id}','lbl',this.value)">
            <select onchange="update('${n.id}','act',this.value)">
              <option value="num">🎲 Random Number</option>
              <option value="txt">💬 Custom Text</option>
              <option value="url">🔗 Open URL</option>
            </select>
            <input type="text" value="${n.data.val}" oninput="update('${n.id}','val',this.value)">
          </div>`;
      }

      document.getElementById('canvas-nodes').appendChild(el);
      dragElement(el, n);
    }

    function dragElement(el, nodeObj) {
      let isDown = false, offX, offY;
      el.addEventListener('mousedown', (e) => {
        if (['INPUT','TEXTAREA','SELECT','SPAN'].includes(e.target.tagName)) return;
        isDown = true;
        offX = e.clientX - el.offsetLeft;
        offY = e.clientY - el.offsetTop;
        el.style.zIndex = 50;
      });
      window.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        nodeObj.x = e.clientX - offX;
        nodeObj.y = e.clientY - offY;
        el.style.left = nodeObj.x + 'px';
        el.style.top = nodeObj.y + 'px';
      });
      window.addEventListener('mouseup', () => { isDown = false; el.style.zIndex = 1; });
    }

    function update(id, k, v) { const n = nodes.find(x => x.id === id); if(n) n.data[k] = v; }
    function delNode(id) { nodes = nodes.filter(x => x.id !== id); document.getElementById(id)?.remove(); }
    function resetCanvas() { nodes = []; document.getElementById('canvas-nodes').innerHTML = ''; }

    // Fast Compiler
    function compileAndShow() {
      const trig = nodes.find(n => n.type === 'trigger');
      const acts = nodes.filter(n => n.type === 'action');
      const cmd = (trig ? trig.data.cmd : 'start').replace('/', '');
      const msg = trig ? trig.data.msg : 'Hello!';

      let code = `import telebot, random\nfrom telebot.types import InlineKeyboardMarkup, InlineKeyboardButton\n\nbot = telebot.TeleBot("YOUR_BOT_TOKEN_HERE")\n\n@bot.message_handler(commands=['${cmd}'])\ndef start(m):\n    kb = InlineKeyboardMarkup()\n`;
      acts.forEach((a, i) => {
        if(a.data.act === 'url') code += `    kb.add(InlineKeyboardButton("${a.data.lbl}", url="${a.data.val}"))\n`;
        else code += `    kb.add(InlineKeyboardButton("${a.data.lbl}", callback_data="act_${i}"))\n`;
      });
      code += `    bot.send_message(m.chat.id, "${msg}", reply_markup=kb)\n\n`;

      if (acts.some(a => a.data.act !== 'url')) {
        code += `@bot.callback_query_handler(func=lambda c: True)\ndef cb(c):\n`;
        acts.forEach((a, i) => {
          if (a.data.act === 'num') {
            const [min, max] = (a.data.val || '1-100').split('-');
            code += `    if c.data == "act_${i}":\n        bot.send_message(c.message.chat.id, f"Random: {random.randint(${min||1}, ${max||100})}")\n`;
          } else if (a.data.act === 'txt') {
            code += `    if c.data == "act_${i}":\n        bot.send_message(c.message.chat.id, "${a.data.val}")\n`;
          }
        });
      }
      code += `\nbot.infinity_polling()\n`;

      document.getElementById('code-area').value = code;
      document.getElementById('export-modal').classList.remove('hidden');
      if (isUnlocked) {
        document.getElementById('box-paywall').style.display = 'none';
        document.getElementById('box-code').style.display = 'block';
      }
    }

    function unlockCode() {
      const utr = document.getElementById('utr-box').value.trim();
      if(utr.length === 12 && /^\d+$/.test(utr)) {
        isUnlocked = true;
        document.getElementById('box-paywall').style.display = 'none';
        document.getElementById('box-code').style.display = 'block';
      } else {
        alert('Invalid 12-digit UTR!');
      }
    }

    function copyScript() {
      navigator.clipboard.writeText(document.getElementById('code-area').value);
      alert('Copied to Clipboard!');
    }

    function downloadScript() {
      const b = new Blob([document.getElementById('code-area').value], { type: 'text/x-python' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'bot.py';
      a.click();
    }

    // Lazy load auth without slowing down load time
    function runAuth() {
      alert("Signed in successfully!");
      document.getElementById('auth-modal').classList.add('hidden');
      document.getElementById('btn-auth').style.display = 'none';
      const disp = document.getElementById('user-display');
      disp.textContent = 'Active User';
      disp.style.display = 'inline-block';
    }
  </script>
</body>
</html>
